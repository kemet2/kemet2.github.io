<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترند حكايات بلادي | تاريخ مصر والقبط | الموقع الرسمى</title>
    <style>
        :root {
            --main-color: #ff0000; 
            --bg-color: #141414; 
            --text-color: #ffffff;
            --card-bg: #1f1f1f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            text-align: center;
        }

        .profile {
            margin-bottom: 30px;
        }

        .profile img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--main-color);
            object-fit: cover;
        }

        .profile h1 {
            margin: 15px 0 5px 0;
            font-size: 1.8rem;
        }

        .profile p {
            color: #aaa;
            font-size: 1rem;
            margin-top: 5px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* تنسيق أزرار التواصل الاجتماعي الجديدة */
        .social-media-box {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .social-icon {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
            transition: transform 0.3s, background-color 0.3s;
        }

        .social-icon:hover {
            transform: scale(1.05);
        }

        .facebook-btn { background-color: #1877F2; }
        .tiktok-btn { background-color: #000000; border: 1px solid #333; }
        .telegram-btn { background-color: #0088cc; }

        .subscribe-btn {
            display: inline-block;
            background-color: var(--main-color);
            color: white;
            text-decoration: none;
            padding: 10px 35px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
        }

        .subscribe-btn:hover {
            transform: scale(1.05);
            background-color: #cc0000;
        }

        h2 {
            text-align: right;
            border-right: 4px solid var(--main-color);
            padding-right: 10px;
            font-size: 1.4rem;
            margin-top: 40px;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            margin-top: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            border: 1px solid #2a2a2a;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--main-color);
        }

        .card img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .card-content h3 {
            margin: 0 0 15px 0;
            font-size: 1rem;
            line-height: 1.4;
        }

        .btn {
            background-color: #2d2d2d;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            align-self: flex-start;
            border: 1px solid #444;
        }

        .card:hover .btn {
            background-color: var(--main-color);
            border-color: var(--main-color);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- القسم العلوي الشخصي -->
        <div class="profile">
            <img src="https://googleusercontent.com" alt="شعار القناة">
            <h1>ترند حكايات بلادي | تاريخ مصر والقبط</h1>
            <p>منصة تعليم القبطى والمصرى القديم، ترانيم قبطية والألحان، قاموس ناطق للغات، قصص وحكايات، مسابقات وتسلية، برامج تعليمية</p>
            
            <!-- أزرار وسائل التواصل الاجتماعي - استبدل علامة # بروابط حساباتك الحقيقية لاحقاً -->
            <div class="social-media-box">
                <a href="https://web.facebook.com/salyl.elfrana" target="_blank" class="social-icon facebook-btn">📱 فيسبوك</a>
                <a href="#" target="_blank" class="social-icon tiktok-btn">🎵 تيك توك</a>
                <a href="#" target="_blank" class="social-icon telegram-btn">✈️ تليجرام</a>
            </div>

            <a href="https://youtu.be/H5sADICrnM8" target="_blank" class="subscribe-btn">اشترك في القناة 🚀</a>
        </div>

        <h2>🎬 أحدث مقاطع الفيديو ونشاطات القناة</h2>
        <div class="links-grid" id="video-grid">
            <!-- سيتم توليد بطاقات الفيديوهات تلقائياً هنا عبر الروابط بالأسفل -->
        </div>

    </div>

      <script>
        const videoUrls = [
            "https://youtu.be", 
            "https://youtu.be", 
            "https://youtu.be", 
            "https://youtu.be", 
            "https://youtu.be", 
            "https://youtu.be",  
            "https://youtube.com", 
            "https://youtube.com"
        ];

        const grid = document.getElementById('video-grid');

        videoUrls.forEach((url) => {
            let videoId = null;

            // دالة برمجية مصلحة ودقيقة ومجربة لاستخراج المعرف بنجاح
            if (url.includes("shorts/")) {
                videoId = url.split("shorts/")[1].split(/[?#]/)[0];
            } else if (url.includes("youtu.be/")) {
                videoId = url.split("youtu.be/")[1].split(/[?#]/)[0];
            } else {
                const regExp = /^.*(v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                videoId = (match && match[2].length == 11) ? match[2] : null;
            }

            if (videoId) {
                // استخدام السيرفر والتركيب البرمجي المضمون لصور يوتيوب
                const thumbUrl = `https://youtube.com{videoId}/hqdefault.jpg`;
                
                const card = document.createElement('a');
                card.href = url;
                card.target = "_blank";
                card.className = "card";
                card.innerHTML = `
                    <img src="${thumbUrl}" alt="فيديو يوتيوب">
                    <div class="card-content">
                        <h3>اضغط لمشاهدة المقطع الجديد على يوتيوب مباشرة بجودة عالية</h3>
                        <span class="btn">شاهد الآن</span>
                    </div>
                `;
                grid.appendChild(card);
            }
        });
    </script>

</body>
</html>
