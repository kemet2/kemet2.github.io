<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ترند حكايات بلادي | تاريخ مصر والقبط ] | موقع مجدى نسيم فهيم</title>
    <style>
        :root {
            --main-color: #ff0000; 
            --bg-color: #141414; 
            --text-color: #ffffff;
            --card-bg: #1f1f1f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            text-align: center;
        }

        .profile {
            margin-bottom: 30px;
        }

        .profile img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--main-color);
            object-fit: cover;
        }

        .profile h1 {
            margin: 15px 0 5px 0;
            font-size: 1.8rem;
        }

        .profile p {
            color: #aaa;
            font-size: 1rem;
            margin-top: 5px;
        }

        .subscribe-btn {
            display: inline-block;
            background-color: var(--main-color);
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }

        .subscribe-btn:hover {
            transform: scale(1.05);
            background-color: #cc0000;
        }

        h2 {
            text-align: right;
            border-right: 4px solid var(--main-color);
            padding-right: 10px;
            font-size: 1.4rem;
            margin-top: 40px;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            margin-top: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            border: 1px solid #2a2a2a;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--main-color);
        }

        .card img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .card-content h3 {
            margin: 0 0 15px 0;
            font-size: 1rem;
            line-height: 1.4;
        }

        .btn {
            background-color: #2d2d2d;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            align-self: flex-start;
            border: 1px solid #444;
        }

        .card:hover .btn {
            background-color: var(--main-color);
            border-color: var(--main-color);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- القسم العلوي الشخصي -->
        <div class="profile">
            <!-- استبدل الرابط برابط صورتك الشخصية أو اتركها لتظهر صورة تلقائية لاحقاً -->
            <img src="https://yt3.ggpht.com/EyktsgD-7GCdJr-lxD6N7pgr5cQDtcJrTEIy77XF8wCRS3F9b7LTpysJ-8hEerHXKW0HK79LmA=s600-c-k-c0x00ffffff-no-rj-rp-mo" alt="شعار القناة">
            <h1>[ترند حكايات بلادي | تاريخ مصر والقبط]</h1>
            <p>[منصة تعلين القبطى والمصرى القديم,ترانيم قبطية والالحان,قاموس ناطق للغات, قصص وحكايات,مسابقات وتسلية, برامج تعليمية]</p>
            <!-- ضع رابط قناتك بدلاً من الرابط أدناه -->
            <a href="https://www.youtube.com/channel/UCIyPyEVDel5GZJ6a_V2l7dw[معرف_قناتك]" target="_blank" class="subscribe-btn">اشترك في القناة 🚀</a>
        </div>

        <h2>🎬 أحدث مقاطع الفيديو ونشاطات القناة</h2>
        <div class="links-grid" id="video-grid">
            <!-- سيتم توليد بطاقات الفيديوهات تلقائياً هنا عبر الروابط المباشرة المرفقة بالأسفل -->
        </div>

    </div>

    <script>
        // مصفوفة الروابط الحقيقية لقناتك المتميزة
        const videoUrls = [
            "https://youtu.be/1fm4ThNj1Zo", 
            "https://youtu.be/_uBjb7VLzHM", 
            "https://youtu.be/ZirTg7ktfKg", 
            "https://youtu.be/y1v_vae0_S4", 
            "https://youtu.be/H9jhyeWlHEQ", 
            "https://youtu.be/qyv5PeMgnP8",  
            "https://youtube.com/shorts/qrlHOCRH1WE", 
            "https://youtube.com/shorts/9lIRaYU5uQk"
        ];

        const grid = document.getElementById('video-grid');

        videoUrls.forEach((url) => {
            let videoId = "";
            
            // استخراج معرف الفيديو بدقة متناهية للفيديوهات العادية وقصيرة Shorts
            if (url.includes("shorts/")) {
                videoId = url.split("shorts/")[1].split("?")[0];
            } else if (url.includes("youtu.be/")) {
                videoId = url.split("youtu.be/")[1].split("?")[0];
            } else if (url.includes("v=")) {
                videoId = url.split("v=")[1].split("&")[0];
            }

            if (videoId) {
                // جلب الصورة المصغرة الأصلية من خوادم يوتيوب بجودة عالية
                const thumbUrl = `https://youtube.com{videoId}/mqdefault.jpg`;
                
                const card = document.createElement('a');
                card.href = url;
                card.target = "_blank";
                card.className = "card";
                card.innerHTML = `
                    <img src="${thumbUrl}" alt="فيديو يوتيوب">
                    <div class="card-content">
                        <h3>اضغط هنا لمشاهدة هذا المقطع الممتع مباشرة على يوتيوب 🎬</h3>
                        <span class="btn">شاهد الآن</span>
                    </div>
                `;
                grid.appendChild(card);
            }
        });
    </script>

</body>
</html>
